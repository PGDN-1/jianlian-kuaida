<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeLab 打字实验室 · 中英文拼写 / 诗词默写</title>
<meta name="description" content="单文件网页版打字练习：英文四六级词库拼写、中文词语听写、古典诗词跟打与默写。可安装为 PWA，离线可用。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{
  --bg:#f8f8f6; --card:#ffffff; --fg:#1c1c1a; --muted:#66665e; --line:#e0e0d8; --hint:#3f3f38;
  --accent:#2f6f5e; --accent-fg:#ffffff; --bad:#b8392b;
  --chip-bg:#ecece6; --chip-on:#ffffff; --chip-fg:#5f5f57;
  --ch:#8c8c84; --ch-ok:#1f6b4d; --ch-bad:#b8392b; --ch-bad-bg:#fbe9e7; --ch-skip:#a8a89f;
  --input-bg:#fbfbf9; --btn-fg:#57574f; --btn-hover:#f2f2ec; --kbd-bg:#f1f1eb; --kbd-fg:#7a7a72;
  --toast-bg:#26261f; --toast-fg:#ffffff;
  --fs:1; --tfs:27px; --pfs:40px;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "SimSun", "Noto Serif SC", Georgia, serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:24px 22px 90px}

.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.brand{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;margin-left:7px}
.spacer{flex:1}
.best{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;gap:2px;background:var(--chip-bg);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--chip-fg);padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--chip-on);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.toolbar label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
select{font:inherit;font-size:13px;color:var(--fg);background:var(--input-bg);border:1px solid var(--line);border-radius:8px;padding:5px 6px;cursor:pointer;max-width:230px}
.chk input{margin:0;accent-color:var(--accent)}
button.primary{font:inherit;font-size:13px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button.primary:hover{filter:brightness(.95)}
button.ghost{font:inherit;font-size:13px;background:transparent;color:var(--btn-fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.ghost:hover{background:var(--btn-hover)}
button.danger{color:var(--bad);border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}

.stats{display:flex;gap:34px;margin:20px 4px 0;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:18px;font-weight:600;line-height:1.1}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.3px}

.stage{margin-top:14px}
.prompt{min-height:96px}
.prompt .big{font-size:calc(var(--pfs) * (0.62 + 0.38 * var(--fs)));font-weight:600;line-height:1.2;letter-spacing:.5px;word-break:break-word}
.prompt .big.serif{font-family:var(--serif);font-weight:500}
.prompt .big.long{font-size:calc(var(--tfs) * var(--fs) * .62);font-weight:500;line-height:1.55;letter-spacing:0}
.prompt .big.idle-msg{font-size:20px;color:var(--muted);font-weight:400}
.prompt .small{margin-top:10px;font-size:calc(16px * (0.86 + 0.14 * var(--fs)));color:var(--hint);line-height:1.75;max-width:46em}
.prompt .big .ipa{font-family:var(--mono);font-size:.4em;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:.6em;white-space:nowrap}
.prompt .small .pos{color:var(--accent);font-weight:700;margin-right:7px}

.typewrap{position:relative;margin-top:22px;min-height:64px}
.target{font-family:var(--mono);font-size:calc(var(--tfs) * var(--fs));line-height:1.85;letter-spacing:.01em;word-break:break-word;min-height:56px;user-select:none}
.target.poem{font-family:var(--serif);font-size:calc(var(--tfs) * var(--fs) * .96);line-height:2.05}
.target.poem.pinyin{font-family:var(--mono);font-size:calc(var(--tfs) * var(--fs) * .8);line-height:1.95}
.target .ch{color:var(--ch);white-space:pre-wrap}
.target .ch.ok{color:var(--ch-ok)}
.target .ch.bad{color:var(--ch-bad);background:var(--ch-bad-bg);border-radius:3px}
.target .ch.skip{color:var(--ch-skip)}
.target.words{line-height:1.45}
.target .wd{display:inline-block;vertical-align:top;text-align:center;margin:0 .14em}
.target .wd .gl{display:block;font-family:var(--sans);font-size:.38em;line-height:1.4;color:var(--hint);letter-spacing:0;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;margin-top:.1em}
.target .wd .gl b{font-weight:700;color:var(--accent);margin-right:.3em}
@media (max-width:640px){.target .wd .gl{font-size:.46em}}
.wordpop{position:fixed;left:0;top:0;z-index:70;max-width:300px;padding:9px 12px 10px;border-radius:11px;background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.20);font-family:var(--sans);pointer-events:none}
.wordpop[hidden]{display:none}
.wordpop .wp-h{font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.3}
.wordpop .wp-h .wp-ipa{font-weight:400;font-size:12px;color:var(--muted);margin-left:7px}
.wordpop .wp-m{margin-top:4px;font-size:13.5px;line-height:1.5;color:var(--hint)}
.wordpop .wp-p{color:var(--accent);font-weight:700;margin-right:7px}
.wordpop .wp-z.miss{color:var(--muted)}
.wordpop .wp-base{color:var(--muted);font-size:11.5px;margin-left:6px}
.target .ch.cur{border-left:2px solid var(--accent);margin-left:-2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
#hidden{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;background:transparent;cursor:text}

.composing{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:20px;margin-top:4px}
.focus-hint{display:none;font-size:12.5px;color:var(--muted);margin-top:6px}
body.blurred .focus-hint{display:block}
body.blurred .target{opacity:.55}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tools button{font:inherit;font-size:12.5px;color:var(--btn-fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
.tools button:hover{background:var(--btn-hover)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--kbd-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;color:var(--kbd-fg)}

.card.narrow{max-width:470px}
.card h2{margin:0 0 14px;font-size:17px;font-weight:650}
.card h3{margin:20px 0 8px;font-size:13.5px;font-weight:600}

.res{display:flex;gap:26px;margin:8px 0 4px;flex-wrap:wrap}
.res .cell{display:flex;flex-direction:column}

.res .cell span{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.miss-list{list-style:none;margin:6px 0 0;padding:0}

.lists li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lists li b{flex:1;font-weight:600}
.lists li span{color:var(--muted);font-size:12px}
button.mini{font:inherit;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--btn-fg);cursor:pointer}

.set-preview{font-family:var(--mono);font-size:calc(var(--tfs) * var(--fs) * .8);line-height:1.7;color:var(--fg);background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;word-break:break-word;user-select:none}
.set-preview .ok{color:var(--ch-ok)}
.set-preview .bad{color:var(--ch-bad);background:var(--ch-bad-bg);border-radius:3px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}

input[type=color]{width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer}

.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);background:var(--toast-bg);color:var(--toast-fg);font-size:12.5px;padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.22s;z-index:60}

<script>
function parseList(raw) {
  var out = [], seen = {};
  raw.trim().split('\n').forEach(function (line) {
    var s = line.trim();
    if (!s || s.charAt(0) === '#') return;
    var p = s.split('|');
    var t = (p[0] || '').trim();
    if (!t) return;
    var key = t.toLowerCase();
    if (seen[key]) return;
    seen[key] = 1;
    out.push({ t: t, hint: (p[1] || '').trim(), py: (p[2] || '').trim() });
  });
  return out;
}

/* key|value 形式的表：音标、词性之类 */
function parseMap(raw) {
  var m = {};
  raw.trim().split('\n').forEach(function (line) {
    var s = line.trim();
    if (!s || s.charAt(0) === '#') return;
    var k = s.indexOf('|');
    if (k < 0) return;
    var a = s.slice(0, k).trim().toLowerCase(), b = s.slice(k + 1).trim();
    if (a) m[a] = b;
  });
  return m;
}

/* word|/ipa/|pos. 形式的词典表（音标 + 词性） */
function parseLex(raw) {
  var m = {};
  raw.trim().split('\n').forEach(function (line) {
    var s = line.trim();
    if (!s || s.charAt(0) === '#') return;
    var p = s.split('|');
    var k = (p[0] || '').trim().toLowerCase();
    if (!k) return;
    m[k] = { ipa: (p[1] || '').trim(), pos: (p[2] || '').trim() };
  });
  return m;
}

/* 拼音去声调：shì jiè → shi jie；ü 记作 v */
var TONE_MAP = {
  'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a', 'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e',
  'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i', 'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o',
  'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u', 'ǖ': 'v', 'ǘ': 'v', 'ǚ': 'v', 'ǜ': 'v',
  'ü': 'v', 'ê': 'e', 'ń': 'n', 'ň': 'n', 'ḿ': 'm'
};
function toneStrip(s) {
  s = String(s == null ? '' : s);
  var o = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    o += TONE_MAP[c] || c;
  }
  return o;
}

function parsePoems(raw) {
  var out = [], seen = {};
  raw.trim().split('\n').forEach(function (line) {
    var s = line.trim();
    if (!s || s.charAt(0) === '#') return;
    var p = s.split('|');
    if ((p[0] || '').trim() && seen[(p[0] || '').trim() + '#' + (p[3] || '').trim()]) return;
    seen[(p[0] || '').trim() + '#' + (p[3] || '').trim()] = 1;
    out.push({
      title: (p[0] || '').trim(),
      author: (p[1] || '').trim(),
      dyn: (p[2] || '').trim(),
      text: (p[3] || '').trim(),
      en: (p[4] || '').trim(),
      py: (p[5] || '').trim()
    });
  });
  return out;
}

/* ========== 键盘音效（v2.0） ========== */
var SND = load(K.snd, {}) || {};
if (typeof SND.on !== 'boolean') SND.on = false;

var _actx = null;
function setSnd(on, vol) {
  if (typeof on === 'boolean') SND.on = on;
  if (typeof vol === 'number' && isFinite(vol)) SND.vol = Math.min(1, Math.max(0, vol));
  save(K.snd, { on: SND.on, vol: SND.vol });
  refreshSetUI();
}
/* kind: ok 打对 / err 打错 / tick 过题 / done 全组完成 */
function sndPlay(kind) {
  if (!SND.on) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_actx) _actx = new AC();
    if (_actx.state === 'suspended' && _actx.resume) _actx.resume();
    var t = _actx.currentTime;
    var vol = SND.vol;
    function blip(freq, dur, delay, type, gain) {
      var o = _actx.createOscillator(), g = _actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t + delay);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain * vol), t + delay + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.connect(g); g.connect(_actx.destination);
      o.start(t + delay); o.stop(t + delay + dur + 0.02);
    }
    if (kind === 'ok') blip(760, 0.045, 0, 'square', 0.10);
    else if (kind === 'err') blip(180, 0.07, 0, 'sawtooth', 0.10);
    else if (kind === 'tick') blip(520, 0.05, 0, 'triangle', 0.09);
    else if (kind === 'done') { blip(523, 0.09, 0, 'triangle', 0.10); blip(659, 0.09, 0.10, 'triangle', 0.10); blip(784, 0.16, 0.20, 'triangle', 0.10); }
  } catch (e) { }
}

/* ========== 模式定义 ========== */
var MODES = {
  en: [{ v: 'type', t: '看英文打字' }, { v: 'toen', t: '看中文写英文' }, { v: 'dict', t: '听英文写词' }],
  zh: [{ v: 'type', t: '看中文打拼音', hz: '看中文打汉字' }, { v: 'tozh', t: '看英文写拼音', hz: '看英文写汉字' }, { v: 'dict', t: '听音写拼音', hz: '听音写汉字' }],
  poem: [{ v: 'poem', t: '跟打原文' }, { v: 'dict', t: '听音写拼音' }, { v: 'recite', t: '看标题默写' }]
};
var HIDDEN = { toen: 1, tozh: 1, dict: 1, recite: 1 };
var COUNTS = { en: [5, 10, 20, 30, 50, 'all'], zh: [10, 20, 30, 50, 'all'], poem: [1, 3, 5, 10, 'all'] };
var UNIT = { en: 'WPM', zh: '字/分', poem: '字/分' };

/* ========== 运行状态 ========== */
var PREFS = load(K.prefs, {}) || {};
var S = {
  tab: PREFS.tab || 'en',
  mode: PREFS.mode || {},
  source: PREFS.source || {},
  count: PREFS.count || {},
  shuffle: PREFS.shuffle === undefined ? true : !!PREFS.shuffle,
  zhInput: PREFS.zhInput === 'hz' ? 'hz' : 'py',
  qs: [], i: 0, phase: 'idle', typed: '', revealed: false,
  t0: 0, tRunning: false, totalTime: 0, charsDone: 0, keys: 0, errs: 0, done: 0,
  composing: false, session: 0, misLogged: false
};
if (!MODES[S.tab]) S.tab = 'en';

function cur() { return S.qs[S.i] || null; }
function hiddenMode() {
  var q = cur();
  return !!(q && q.hidden && !S.revealed && S.phase !== 'flash' && S.phase !== 'done');
}

/* ========== 题目池 ========== */
function customLists() {
  var l = load(K.custom, []);
  return Array.isArray(l) ? l : [];
}

function poolRows(tab, srcVal) {
  var out = [];
  if (srcVal && srcVal.indexOf('c:') === 0) {
    var id = srcVal.slice(2);
    var list = null;
    customLists().forEach(function (x) { if (x.id === id) list = x; });
    if (!list) return out;
    (list.rows || []).forEach(function (r) {
      if (tab === 'poem') { if (r.p) out.push(r); }
      else if (r.w) out.push(r);
    });
    return out;
  }
  if (tab === 'en') {
    var bank = srcVal === 'oxford' ? OXFORD : srcVal === 'cet6' ? CET6 : srcVal === 'cet4s' ? CET4S : srcVal === 'cet6s' ? CET6S : CET4;
    var isSent = (srcVal === 'cet4s' || srcVal === 'cet6s');
    bank.forEach(function (r) { out.push({ w: 1, text: r.t, hint: r.hint, sent: isSent ? 1 : 0 }); });
  } else if (tab === 'zh') {
    ZHWORDS.forEach(function (r) { out.push({ w: 1, text: r.t, hint: r.hint, py: r.py }); });
  } else {
    POEMS.forEach(function (p) { out.push({ p: 1, title: p.title, author: p.author, dyn: p.dyn, text: p.text, en: p.en, py: p.py }); });
  }
  return out;
}

function toQuestion(tab, mode, it) {
  var q = { text: it.text || '', big: '', small: '', speak: it.text || '', lang: tab === 'en' ? 'en-US' : 'zh-CN', isPoem: !!it.p, hidden: !!HIDDEN[mode], meta: '', long: false, ipa: '', pos: '', show: '', sub: '' };
  if (it.p) {
    q.meta = '《' + it.title + '》' + it.author;
    q.big = '《' + it.title + '》';
    q.small = it.author + ' · ' + it.dyn + (it.en ? '　—　' + it.en : '');
    q.lang = 'zh-CN';
    var ppy = String(it.py || '').trim();
    var poemPy = mode === 'dict' ? !!ppy : (mode !== 'recite' && !!ppy && S.zhInput !== 'hz');
    if (mode === 'recite') {
      q.small = '默写这首' + it.dyn + '诗：' + it.author + (it.en ? '　—　' + it.en : '');
    } else if (poemPy) {
      q.show = it.text;
      q.text = toneStrip(ppy);
      q.small = mode === 'dict'
        ? '听读音，按音节写出整首诗的拼音（不用打声调，ü 打 v）　·　按 Alt+P 重听'
        : (it.text + (it.en ? '　—　' + it.en : ''));
    } else if (mode === 'dict' || S.zhInput !== 'hz') {
      q.small = '这首诗暂无拼音数据，先用汉字输入练习吧（工具栏「跟打」可切回汉字）';
    }
    return q;
  }
  var sent = !!it.sent;
  var unit = sent ? '句子' : (tab === 'en' ? '单词' : '词语');
  if (tab === 'en') {
    var key = String(it.text || '').trim().toLowerCase();
    var ipa = sent ? '' : ipaOf(key);
    var pos = sent ? '' : posOf(key);
    q.sent = sent;
    if (mode === 'type') {
      q.big = sent ? '' : it.text;
      q.ipa = ipa;
      q.pos = pos;
      q.small = it.hint || '';
    } else if (mode === 'toen') {
      q.big = it.hint || '（无中文提示）';
      q.long = sent;
      q.small = sent ? '看中文翻译，写出英文整句（较难，可先用「看英文打字」熟悉句子）' : '看中文，写出对应的英文' + unit;
    } else {
      q.big = '🔊 听写';
      q.ipa = ipa;
      q.small = '听读音，写出英文' + unit + (it.hint ? '　' + (pos ? pos + ' ' : '') + '释义：' + it.hint : '') + '　·　按 Alt+P 重听';
    }
  } else {
    var py = it.py || '';
    var isPy = !!(py && S.zhInput !== 'hz');
    q.show = it.text;
    if (isPy) q.text = toneStrip(py);
    if (mode === 'type') {
      q.big = it.text;
      q.small = isPy ? (py + '　·　' + (it.hint || '')) : (it.hint || '');
    } else if (mode === 'tozh') {
      q.big = it.hint || '（无英文提示）';
      q.small = isPy ? '看英文，写出这个词语的拼音' : '看英文，写出对应的中文' + unit;
    } else {
      q.big = '🔊 听写';
      q.small = '听读音，写出' + (isPy ? '拼音' : '中文') + unit + (it.hint ? '　释义：' + it.hint : '') + '　·　按 Alt+P 重听';
    }
  }
  return q;
}

function buildQuestions() {
  var tab = S.tab, mode = S.mode[tab] || MODES[tab][0].v, src = S.source[tab];
  var items = poolRows(tab, src);
  if (!items.length) return [];
  if (S.shuffle) shuffle(items);
  var n = S.count[tab] || COUNTS[tab][0];
  if (n !== 'all') items = items.slice(0, Math.min(parseInt(n, 10), items.length));
  var out = [];
  items.forEach(function (it) {
    var q = toQuestion(tab, mode, it);
    if (q && strip(q.text).length) out.push(q);
  });
  return out;
}

function go(i) {

function sync() {

  var t = strip(q.text);
  var y = strip($('hidden').value);
  if (y.length > t.length) y = y.slice(0, t.length);
  if ($('hidden').value !== y) $('hidden').value = y;
  var prev = strip(S.typed);

function csvQ(s) {
  s = String(s == null ? '' : s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportHistoryCsv() {
  var rows = histAll();
  if (!rows.length) { toast('还没有成绩记录'); return; }
  var lines = ['时间,分类,模式,词库,完成题数,速度,单位,正确率%,用时s,字符数'];
  rows.forEach(function (r) {
    lines.push([
      csvQ(new Date(r.ts).toLocaleString()), csvQ(tabName(r.tab)), csvQ(modeName(r.tab, r.mode)),
      csvQ(srcName(r.tab, r.src)), r.done + '/' + r.total, r.speed,
      r.tab === 'en' ? 'WPM' : '字/分', r.acc, r.sec, r.chars || 0
    ].join(','));
  });
  var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '简练快打-成绩-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 3000);
  toast('已导出 ' + rows.length + ' 条成绩');
}

/* ---- 分享卡片：整组成绩画成 PNG ---- */
var CANVAS_SANS = '"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,sans-serif';
function shareCard() {
  var rows = histAll();
  var r = rows[rows.length - 1];
  if (!r) { toast('还没有成绩记录，先练一组吧'); return; }
  var W = 1080, H = 608;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  if (!ctx) { toast('当前浏览器不支持Canvas'); return; }
  var bg = effBg(), dark = luma(bg) < 0.52;
  var fg = dark ? shade(bg, .88) : '#1c1c1a';
  var muted = dark ? shade(bg, .60) : '#66665e';
  var accent = dark ? '#63c2a4' : '#2f6f5e';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 10);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = fg;
  ctx.font = '600 36px ' + CANVAS_SANS;
  ctx.fillText('TypeLab · 打字实验室', 64, 96);
  ctx.font = '24px ' + CANVAS_SANS;
  ctx.fillStyle = muted;
  ctx.fillText('简练快打 — 单文件离线打字练习', 64, 134);
  ctx.fillStyle = fg;
  ctx.font = '700 148px ' + CANVAS_SANS;
  ctx.fillText(String(r.speed), 64, 306);
  var spW = ctx.measureText(String(r.speed)).width;
  ctx.font = '600 40px ' + CANVAS_SANS;
  ctx.fillStyle = accent;
  ctx.fillText(r.tab === 'en' ? 'WPM' : '字/分', 64 + spW + 20, 306);
  ctx.font = '30px ' + CANVAS_SANS;
  ctx.fillStyle = fg;
  ctx.fillText('正确率 ' + r.acc + '% · 用时 ' + r.sec + 's · 完成 ' + r.done + '/' + r.total + ' 题', 64, 374);
  ctx.font = '26px ' + CANVAS_SANS;
  ctx.fillStyle = muted;
  ctx.fillText(tabName(r.tab) + ' · ' + modeName(r.tab, r.mode) + ' · ' + srcName(r.tab, r.src) + ' · ' + new Date(r.ts).toLocaleString(), 64, 422);
  ctx.font = '22px ' + CANVAS_SANS;
  ctx.fillText('github.com/PGDN-1/jianlian-kuaida', 64, H - 52);
  try {
    cv.toBlob(function (blob) {
      if (!blob) { toast('生成失败'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '简练快打-成绩-' + r.speed + (r.tab === 'en' ? 'wpm' : 'cpm') + '.png';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 3000);
      toast('成绩卡片已导出');
    }, 'image/png');
  } catch (e) { toast('生成失败'); }
}

/* ========== 语音 ========== */
function speak() {
  var q = cur();
  if (!q) return;
  if (!('speechSynthesis' in window)) { toast('这个浏览器不支持语音朗读'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(q.speak || q.text);
    u.lang = q.lang || 'zh-CN';
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch (e) { toast('朗读失败'); }
}

/* ========== 错题本 ========== */
function addMistake(q, kind) {
  if (!q) return;
  var label = q.show || q.text || '';
  var list = load(K.miss, []);
  if (!Array.isArray(list)) list = [];
  var lang = q.isPoem ? 'poem' : (S.tab === 'en' ? 'en' : 'zh');
  var found = null;
  list.forEach(function (m) { if (m.t === label && m.lang === lang) found = m; });
  if (found) {
    found.n = (found.n || 1) + 1;
    found.ts = Date.now();
    found.kind = kind;
  } else {
    list.push({ t: label, hint: q.small || q.big || '', lang: lang, kind: kind, n: 1, ts: Date.now() });
  }
  if (list.length > 600) list = list.slice(list.length - 600);
  save(K.miss, list);
}

function focusInput() {
  var el = $('hidden');
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
}

/* ========== 工具栏 ========== */
function sourcesFor(tab) {
  var list = [];
  if (tab === 'en') {
    list.push({ v: 'cet4', t: '四级 CET-4 · ' + CET4.length + ' 词' });
    list.push({ v: 'cet6', t: '六级 CET-6 · ' + CET6.length + ' 词' });
    list.push({ v: 'oxford', t: '牛津核心 3000 · ' + OXFORD.length + ' 词' });
    list.push({ v: 'cet4s', t: '四级长句 · ' + CET4S.length + ' 句' });
    list.push({ v: 'cet6s', t: '六级长句 · ' + CET6S.length + ' 句' });
  } else if (tab === 'zh') {
    list.push({ v: 'zh', t: '常用中文词语 · ' + ZHWORDS.length + ' 条' });
  } else {
    list.push({ v: 'poem', t: '唐诗宋词 · ' + POEMS.length + ' 首' });
  }
  customLists().forEach(function (c) {
    if (c.lang !== tab) return;
    list.push({ v: 'c:' + c.id, t: c.name + ' · ' + (c.rows || []).length + ' 条' });
  });
  return list;
}

function fillSelect(el, opts, value, fallback) {
  el.textContent = '';
  var has = false;
  opts.forEach(function (o) {
    var op = document.createElement('option');
    op.value = o.v;
    op.textContent = o.t;
    el.appendChild(op);
    if (o.v === value) has = true;
  });
  el.value = has ? value : fallback;
  return el.value;
}

function renderToolbar() {
  var tab = S.tab;
  $('zhInputWrap').style.display = (tab === 'zh' || tab === 'poem') ? '' : 'none';
  $('zhInputLabel').textContent = tab === 'poem' ? '跟打' : '输入';
  $('zhInput').value = S.zhInput;
  var srcs = sourcesFor(tab);
  S.source[tab] = fillSelect($('source'), srcs, S.source[tab], srcs[0].v);
  var modes = MODES[tab].map(function (m) { return { v: m.v, t: (tab === 'zh' && S.zhInput === 'hz' && m.hz) ? m.hz : m.t }; });
  S.mode[tab] = fillSelect($('submode'), modes, S.mode[tab], modes[0].v);
  var sentSrc = tab === 'en' && (S.source[tab] === 'cet4s' || S.source[tab] === 'cet6s');
  var counts = COUNTS[tab].map(function (c) { return { v: String(c), t: c === 'all' ? '全部' : String(c) + (tab === 'poem' ? ' 首' : sentSrc ? ' 句' : ' 条') }; });
  S.count[tab] = fillSelect($('count'), counts, String(S.count[tab] || ''), counts[0].v);
  $('shuffle').checked = S.shuffle;
}

function savePrefs() {
  save(K.prefs, { tab: S.tab, mode: S.mode, source: S.source, count: S.count, shuffle: S.shuffle, zhInput: S.zhInput });
}

  var el = document.createElement(tag);

  if (text != null) el.textContent = text;
  return el;
}

  if (!Array.isArray(mLists)) mLists = [];
  var mPractice = rowEl('button', 'ghost', '用错题练一组');

  var mCopy = rowEl('button', 'ghost', '复制错题');

/* ========== 数据备份：导出 / 导入 ========== */
function backupData() {
  var out = { app: 'jianlian-kuaida', name: '简练快打', version: 1, savedAt: new Date().toISOString(), data: {} };
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf('typelab.') === 0) out.data[k] = localStorage.getItem(k);
  }
  return out;
}
function exportBackup() {
  var obj = backupData();
  var n = Object.keys(obj.data).length;
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  var d = new Date();
  var p2 = function (x) { return (x < 10 ? '0' : '') + x; };
  var name = '简练快打-备份-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 3000);
  toast('已导出备份（' + n + ' 项）');
}
function importBackup() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var obj;
      try { obj = JSON.parse(String(fr.result || '')); } catch (e) { toast('不是有效的备份文件'); return; }
      var data = obj && obj.data ? obj.data : obj;
      if (!data || typeof data !== 'object') { toast('备份文件格式不对'); return; }
      var keys = Object.keys(data).filter(function (k) { return k.indexOf('typelab.') === 0; });
      if (!keys.length) { toast('备份里没有可导入的数据'); return; }
      if (!confirm('将用备份覆盖当前的成绩、错题和自定义词库（共 ' + keys.length + ' 项），继续吗？')) return;
      keys.forEach(function (k) { try { localStorage.setItem(k, String(data[k])); } catch (e) {} });
      toast('导入完成，正在刷新…');
      setTimeout(function () { location.reload(); }, 700);
    };
    fr.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(function () { inp.remove(); }, 30000);
}

function paintModalLists() {
  var ul = $('imLists');
  if (!ul) return;
  ul.textContent = '';
  var lists = customLists();
  if (!lists.length) {
    ul.appendChild(rowEl('li', null, '（空）'));
  } else {
    lists.forEach(function (c) {
      var li = document.createElement('li');
      li.appendChild(rowEl('b', null, c.name));
      li.appendChild(rowEl('span', null, ({ en: '英文', zh: '中文', poem: '诗词' }[c.lang] || '') + ' · ' + (c.rows || []).length + ' 条'));
      var use = rowEl('button', 'mini', '练这组');
      use.addEventListener('click', function () {
        S.tab = c.lang;
        S.source[c.lang] = 'c:' + c.id;
        savePrefs(); renderTabs(); renderToolbar(); closeModal(); start();
      });
      var del = rowEl('button', 'mini danger', '删除');
      del.addEventListener('click', function () {
        var rest = customLists().filter(function (x) { return x.id !== c.id; });
        save(K.custom, rest);
        if (S.source[c.lang] === 'c:' + c.id) { S.source[c.lang] = null; renderToolbar(); start(); }
        paintModalLists();
        toast('已删除「' + c.name + '」');
      });
      li.appendChild(use); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  var ml = $('missList');
  if (!ml) return;
  ml.textContent = '';
  var miss = load(K.miss, []);
  if (!Array.isArray(miss)) miss = [];
  if (!miss.length) {
    ml.appendChild(rowEl('li', null, '（暂无错题，继续加油）'));
    return;
  }
  miss.slice().reverse().slice(0, 80).forEach(function (m) {
    var li = document.createElement('li');
    li.appendChild(rowEl('b', null, m.t.length > 42 ? m.t.slice(0, 42) + '…' : m.t));
    var tag = m.kind === 'skip' ? '跳过' : m.kind === 'reveal' ? '看答案' : '错误';
    li.appendChild(rowEl('span', null, tag + ' · 错 ' + (m.n || 1) + ' 次 · ' + (m.hint || '').slice(0, 30)));
    ml.appendChild(li);
  });
}

function bindModal() {
  var modal = $('modal');
  $('imFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { $('imText').value = String(fr.result || ''); $('imName').value = $('imName').value || f.name.replace(/\.[^.]+$/, ''); };
    fr.readAsText(f, 'utf-8');
  });
  $('imClear').addEventListener('click', function () { $('imText').value = ''; });
  $('imGo').addEventListener('click', doImport);
  $('missClear').addEventListener('click', function () {
    save(K.miss, []);
    paintModalLists();
    toast('错题本已清空');
  });
  $('backupExport').addEventListener('click', exportBackup);
  $('backupImport').addEventListener('click', importBackup);
  $('missCopy').addEventListener('click', function () {
    var miss = load(K.miss, []);
    if (!Array.isArray(miss) || !miss.length) { toast('错题本是空的'); return; }
    var txt = miss.map(function (m) { return m.t + (m.hint ? '|' + m.hint : ''); }).join('\n');
    try {
      navigator.clipboard.writeText(txt);
      toast('已复制 ' + miss.length + ' 条');
    } catch (e) { toast('复制失败，请手动选择'); }
  });
  $('missPractice').addEventListener('click', function () {
    var miss = load(K.miss, []);
    if (!Array.isArray(miss)) miss = [];
    var lang = S.tab;
    var rows = [];
    miss.forEach(function (m) {
      if (m.lang !== lang) return;
      var row;
      if (lang === 'poem') row = { p: 1, title: '错题', author: '', dyn: '', text: m.t, en: m.hint || '' };
      else if (lang === 'zh') {
        var zhRow = null;
        ZHWORDS.forEach(function (x) { if (x.t === m.t) zhRow = x; });
        row = { w: 1, text: m.t, hint: m.hint || '', py: zhRow ? zhRow.py : '' };
      }
      else row = { w: 1, text: m.t, hint: m.hint || '' };
      /* 间隔重复：错得越多的词，在这一组里重复出现次数越多（1~5 次） */
      var w = Math.max(1, Math.min(5, m.n || 1));
      for (var k = 0; k < w; k++) rows.push(row);
    });
    if (!rows.length) { toast('当前分类下没有错题'); return; }
    shuffle(rows);
    var lists = customLists().filter(function (x) { return x.id !== 'mistakes-tmp'; });
    lists.push({ id: 'mistakes-tmp', lang: lang, name: '错题复习', rows: rows });
    save(K.custom, lists);
    S.source[lang] = 'c:mistakes-tmp';
    savePrefs(); renderToolbar(); closeModal(); start();
  });
  $('closeModal').addEventListener('click', closeModal);
}

function doImport() {
  var kind = $('imKind').value;
  var name = ($('imName').value || '').trim() || ({ en: '自定义英文词库', zh: '自定义中文词语', poem: '自定义诗词' }[kind]);
  var raw = $('imText').value || '';
  var rows = [];
  raw.split('\n').forEach(function (line) {
    var s = line.replace(/\r$/, '').trim();
    if (!s) return;
    var p = s.split('|');
    if (kind === 'poem') {
      if (p.length < 4) return;
      var ptext, pen;
      if (p.length >= 5) { ptext = p.slice(3, p.length - 1).join('|'); pen = p[p.length - 1]; }
      else { ptext = p[3]; pen = ''; }
      rows.push({
        p: 1,
        title: (p[0] || '').trim(),
        author: (p[1] || '').trim(),
        dyn: (p[2] || '').trim(),
        text: String(ptext).trim(),
        en: String(pen || '').trim()
      });
    } else {
      if (p.length < 2) return;
      rows.push({ w: 1, text: (p[0] || '').trim(), hint: (p[1] || '').trim(), py: (p[2] || '').trim() });
    }
  });
  if (!rows.length) { toast('没解析到内容，请检查格式'); return; }
  var lists = customLists();
  lists.push({ id: 'l' + Date.now().toString(36), lang: kind, name: name, rows: rows });
  save(K.custom, lists);
  S.tab = kind;
  S.source[kind] = 'c:' + lists[lists.length - 1].id;
  savePrefs();
  renderTabs(); renderToolbar();
  closeModal();
  start();
  toast('已导入 ' + rows.length + ' 条到「' + name + '」');
}

function openModal() {
  var h = $('hidden');
  if (h && h.blur) h.blur();
  $('modal').classList.add('on');
  buildModal();
  document.body.classList.add('blurred');
}
function closeModal() {
  $('modal').classList.remove('on');
  $('modal').textContent = '';
  document.body.classList.remove('blurred');
  focusInput();
}

/* ========== 事件绑定 ========== */
$('tabs').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  var tab = b.getAttribute('data-tab');
  if (!tab || tab === S.tab) return;
  S.tab = tab;
  savePrefs(); renderTabs(); renderToolbar(); start();
});

$('source').addEventListener('change', function () { S.source[S.tab] = this.value; savePrefs(); start(); });
$('submode').addEventListener('change', function () { S.mode[S.tab] = this.value; savePrefs(); start(); });
$('count').addEventListener('change', function () { S.count[S.tab] = this.value; savePrefs(); start(); });
$('shuffle').addEventListener('change', function () { S.shuffle = this.checked; savePrefs(); start(); });
$('zhInput').addEventListener('change', function () { S.zhInput = this.value === 'hz' ? 'hz' : 'py'; savePrefs(); renderToolbar(); start(); });

$('startBtn').addEventListener('click', function () { start(); });
$('manageBtn').addEventListener('click', openModal);
$('settingsBtn').addEventListener('click', openSettings);
$('statsBtn').addEventListener('click', openStats);
$('speakBtn').addEventListener('click', function () { speak(); });
$('skipBtn').addEventListener('click', function () { skip(); });
$('revealBtn').addEventListener('click', function () { reveal(); });
$('restartBtn').addEventListener('click', function () { start(); });

var hiddenEl = $('hidden');
hiddenEl.addEventListener('compositionstart', function () { S.composing = true; });
hiddenEl.addEventListener('compositionupdate', function (e) { $('composing').textContent = e.data || ''; });
hiddenEl.addEventListener('compositionend', function () {
  S.composing = false;
  $('composing').textContent = '';
  setTimeout(sync, 0);
});
hiddenEl.addEventListener('input', function (e) {
  if (S.composing || e.isComposing) {
    $('composing').textContent = hiddenEl.value;
    return;
  }
  sync();
});
hiddenEl.addEventListener('blur', function () { document.body.classList.add('blurred'); });
hiddenEl.addEventListener('focus', function () { document.body.classList.remove('blurred'); });

document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.closest) return;
  if (t.closest('#modal') || t.closest('button') || t.closest('select') || t.closest('label') || t.closest('input') || t.closest('textarea') || t.closest('a')) return;
  if ($('modal').classList.contains('on')) return;
  focusInput();
});

document.addEventListener('keydown', function (e) {
  var modalOpen = $('modal').classList.contains('on');
  if (modalOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  if (e.key === 'Tab') { e.preventDefault(); start(); return; }
  if (e.key === 'Escape') { hideWordPop(); e.preventDefault(); skip(); return; }
  if (e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); speak(); return; }
  if (e.key === 'Enter' && S.phase !== 'typing') { e.preventDefault(); start(); return; }
});

/* 双击或右键句中的单词 → 弹出小窗显示音标、词性、释义 */
(function () {
  var tw = document.querySelector('.typewrap');
  if (!tw) return;
  function onLook(ev) {
    var el = wordElAt(ev.clientX, ev.clientY);
    if (!el) return;
    var info = wordInfo(wordTextOf(el));
    if (!info) return;
    ev.preventDefault();
    showWordPop(info, ev.clientX, ev.clientY);
  }
  tw.addEventListener('dblclick', onLook);
  tw.addEventListener('contextmenu', onLook);
  document.addEventListener('scroll', hideWordPop, true);
  window.addEventListener('resize', hideWordPop);
})();

/* ========== 启动 ========== */
$('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

applyLook();
renderToolbar();
renderAll();
start();
focusInput();
setInterval(function () {
  if (S.phase === 'typing' && S.tRunning) renderStats();
}, 200);

/* 实时速度条：打字时每 300ms 采样一次 */
setInterval(function () {
  if (S.phase === 'typing' && S.tRunning) {
    sparkData.push(speedNow());
    if (sparkData.length > 160) sparkData.shift();
    drawSpark();
  }
}, 300);

/* 移动端：软键盘弹出/收起时，保证当前行在视口内 */
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function () {
    if (document.activeElement === $('hidden') && _rt && _rt.curEl && typeof _rt.curEl.scrollIntoView === 'function') {
      try { _rt.curEl.scrollIntoView({ block: 'nearest' }); } catch (e) { }
    }
  });
}

/* PWA：仅在 http(s) 下注册 service worker；双击打开的 file:// 页面完全不受影响 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { });
  });
}
</script>
</body>
</html>
